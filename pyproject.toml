[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rl-hedging"
version = "0.1.0"
description = "Does an RL agent hedge a short option better than delta hedging once costs exist and the model is wrong?"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aradhya Somani" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "pre-commit>=3.7"]
# Needed from Phase 3. Phase 2 uses it only for its env checker.
rl = ["stable-baselines3>=2.3", "sb3-contrib>=2.3", "torch>=2.2", "tensorboard>=2.16", "optuna>=3.6", "matplotlib>=3.8"]
# Phase 5: the database loader, the API and the demo.
serve = ["fastapi>=0.110", "uvicorn>=0.29", "psycopg[binary]>=3.1", "streamlit>=1.50", "httpx>=0.27"]

[project.scripts]
hedge = "hedge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hedge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: Monte Carlo tests that take more than a few seconds"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]
